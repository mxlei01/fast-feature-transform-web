# Prod: applied once with `kubectl apply -f`, after which ArgoCD polls this repository and deploys
# master, so merging a pull request is the promotion.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fare-web
  namespace: argocd
spec:
  project: fare-web
  source:
    repoURL: https://github.com/mxlei01/fast-feature-transform-web.git
    targetRevision: master
    path: deploy/manifests/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: fare-web
  # The namespace is created by hand (deploy/README.md), so the project allows no cluster-wide objects.
  syncPolicy:
    automated: { prune: false, selfHeal: false }
