# Staging: applied once with `kubectl apply -f`, after which ArgoCD polls this repository.
# `make deploy-staging` points targetRevision at the issue branch under review; the remote's
# branches are named by issue number, so there is no long-lived staging branch.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fare-web-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mxlei01/fast-feature-transform-web.git
    targetRevision: master
    path: deploy/manifests/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: fare-web-staging
  syncPolicy:
    automated: { prune: false, selfHeal: false }
    syncOptions:
      - CreateNamespace=true
