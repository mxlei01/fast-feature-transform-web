apiVersion: v1
kind: ConfigMap
metadata:
  name: fare-web-config
  labels: { app: fare-web }
# Settings the site reads at startup (see the docstring of app/app/settings.py). DJANGO_SECRET_KEY
# comes from the Secret fare-web-secret instead.
data:
  DJANGO_DEBUG: "false"
  # The public hostname is added when the site gets one (deploy/README.md). localhost stays: the
  # probes and the smoke check send Host: localhost.
  DJANGO_ALLOWED_HOSTS: "localhost"
  DJANGO_CSRF_TRUSTED_ORIGINS: ""
  # Proxies in front of the pod that append X-Forwarded-For. With none, every client is the pod's
  # peer address.
  RATELIMIT_TRUSTED_FORWARDED_HOPS: "0"
  # Public traffic arrives through the Cloudflare Tunnel, whose edge records the visitor in
  # CF-Connecting-IP; without it every visitor would share the connector's address. The NetworkPolicy
  # lets only the connector and the smoke Job reach the pod, and any LAN Ingress must strip the header
  # (fare-web-strip-cf-headers).
  RATELIMIT_TRUST_CF_HEADER: "true"
  FARE_RATE_LIMIT: "30"
  LOG_FORMAT: "json"
  LOG_LEVEL: "INFO"
