# CI: lint, format and security checks, and a render of the Kubernetes manifests, on every PR and master push.
#
# The tests and the type check need the vendored fast-inference wheel, which is built for
# free-threaded CPython 3.14 on macOS 27 arm64 only, so they run locally with `make all` (see
# README.md). Ruff and bandit read the source without installing the project.
name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by commit: a tag can be moved to other code. Dependabot proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          version: "0.13.6"
          # setup-uv v10.3.2 knows checksums up to uv 0.13.5; this is 0.13.6's
          # uv-x86_64-unknown-linux-gnu.tar.gz, as uv's release lists it.
          checksum: "f29c3e94ffabd7e6f3ba521dba169a9b7ec12100bf3257087f0f24f6123f3645"
          # The job fetches two pinned tools, which a cache would barely speed up, and a cache is one more
          # thing a run passes to later runs.
          enable-cache: false

      - name: Lint (ruff)
        run: uvx ruff@0.17.0 check app training deploy

      - name: Format check (ruff)
        run: uvx ruff@0.17.0 format --check app training deploy

      - name: Security check (bandit)
        run: uvx --from "bandit[toml]==1.9.4" bandit -r -c pyproject.toml app training deploy

      - name: Render the Kubernetes manifests (kustomize)
        run: |
          kubectl kustomize deploy/manifests/overlays/staging > /dev/null
          kubectl kustomize deploy/manifests/overlays/prod > /dev/null
